[tool.poetry]
name = "fastapi-querybuilder"
version = "0.1.18"
description = "Smart filtering, sorting, and searching for FastAPI with SQLAlchemy"
authors = ["Bhadri01 <bhadrinathan28@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/bhadri01/fastapi-querybuilder"
keywords = ["fastapi", "sqlalchemy", "filters", "query", "sort", "search", "pagination", "api", "rest"]
include = ["fastapi_querybuilder/py.typed"]
packages = [{ include = "fastapi_querybuilder" }]

classifiers = [
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.135.2,<1.0"
uvicorn = ">=0.35,<1.0"
sqlalchemy = ">=2.0,<2.1"
fastapi_pagination = ">=0.13.2,<1.0"
aiosqlite = ">=0.21.0,<1.0"
# Security floors also apply to downstream installs that do not use poetry.lock.
anyio = ">=4.14.2,<5.0"
starlette = ">=1.3.1,<2.0"
h11 = ">=0.16.0,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1,<10.0"
pytest-cov = ">=7.0,<8.0"
httpx = ">=0.28.1,<0.29"
ruff = ">=0.17,<0.18"
mypy = ">=2.4,<3.0"
build = ">=1.6,<2.0"
pip-audit = ">=2.10,<3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["fastapi_querybuilder"]
warn_unused_ignores = true

[tool.coverage.paths]
source = ["fastapi_querybuilder"]

[tool.coverage.run]
source = ["fastapi_querybuilder"]

[build-system]
requires = ["poetry-core>=2.5,<3.0"]
build-backend = "poetry.core.masonry.api"
